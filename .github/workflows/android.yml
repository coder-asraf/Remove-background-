name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android Project
        working-directory: android
        run: |
          echo "Checking Android project files..."
          test -f gradlew || {
            echo "ERROR: android/gradlew not found"
            exit 1
          }
          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERROR: Gradle wrapper properties not found"
            exit 1
          }
          chmod +x gradlew
          echo "Android project files found."

      - name: Diagnose Gradle Wrapper
        working-directory: android
        run: |
          echo "Gradle wrapper file type:"
          file gradlew

          echo "Gradle wrapper first lines:"
          head -n 5 gradlew

          echo "Java version:"
          java -version

          echo "Gradle version:"
          ./gradlew --version

      - name: Run Unit Tests
        working-directory: android
        run: |
          ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find android -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cutout-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
